<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NETRA — Orbital Reroute</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="theme-color" content="#05070A" />
    <style>
      :root {
        --bg-void: #05070a;
        --accent-orange: #ff6b1a;
        --text-primary: #e6edf3;
        --text-secondary: #8b949e;
        --line-subtle: rgba(255, 255, 255, 0.08);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: var(--bg-void);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 24px;
        text-align: center;
      }
      .reroute-card {
        background: rgba(13, 17, 23, 0.85);
        border: 1px solid var(--line-subtle);
        border-radius: 12px;
        padding: 32px 28px;
        max-width: 440px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      }
      .reroute-badge {
        display: inline-block;
        padding: 4px 10px;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent-orange);
        background: rgba(255, 107, 26, 0.12);
        border: 1px solid rgba(255, 107, 26, 0.3);
        border-radius: 4px;
        margin-bottom: 16px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 8px;
        letter-spacing: 0.02em;
      }
      p {
        font-size: 13px;
        color: var(--text-secondary);
        line-height: 1.5;
        margin-bottom: 24px;
      }
      .reroute-spinner {
        width: 28px;
        height: 28px;
        border: 2px solid rgba(255, 107, 26, 0.2);
        border-top-color: var(--accent-orange);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 20px auto;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      a {
        color: var(--accent-orange);
        text-decoration: none;
        font-size: 12px;
        letter-spacing: 0.05em;
        border-bottom: 1px dashed rgba(255, 107, 26, 0.5);
        padding-bottom: 2px;
      }
      a:hover {
        border-bottom-style: solid;
      }
    </style>
    <!-- Single Page App Redirect Script for GitHub Pages & Static Hosts -->
    <script>
      (function() {
        var l = window.location;
        // Determine whether app is deployed under a repo subpath on *.github.io (e.g. username.github.io/netra-isro/)
        // or at the domain root (custom domain, username.github.io root, or Vercel/Netlify preview)
        var isGithubProject = (
          l.hostname.endsWith('github.io') &&
          l.pathname.split('/').length > 2 &&
          l.pathname.split('/')[1].length > 0
        );
        var pathSegmentsToKeep = isGithubProject ? 1 : 0;

        var repoPrefix = pathSegmentsToKeep === 1 ? '/' + l.pathname.split('/')[1] : '';
        var remainingPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
        var routePath = remainingPath ? '/' + remainingPath : '';

        var redirectUrl = (
          l.protocol + '//' + l.host + repoPrefix + '/?' +
          (routePath.slice(1).replace(/&/g, '~and~')) +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );

        // Ensure there is a path separator if routePath is not empty
        if (routePath.length > 0) {
          redirectUrl = (
            l.protocol + '//' + l.host + repoPrefix + '/?' +
            routePath.replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
          );
        }

        l.replace(redirectUrl);
      })();
    </script>
  </head>
  <body>
    <div class="reroute-card">
      <div class="reroute-badge">ISRO // NETRA TELEMETRY</div>
      <div class="reroute-spinner" aria-hidden="true"></div>
      <h1>Orbital Route Synchronization</h1>
      <p>Synchronizing telemetry vector coordinates with the central mission node...</p>
      <noscript>
        <p>JavaScript is required to restore orbital state automatically.</p>
        <a href="./">Proceed to Mission Control Root</a>
      </noscript>
    </div>
  </body>
</html>
