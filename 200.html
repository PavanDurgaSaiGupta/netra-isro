    <!-- Single Page App Redirect Restoration for GitHub Pages / static hosting -->
    <script>
      (function(l) {
        if (l.search && l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          var basePath = l.pathname.endsWith('/') ? l.pathname.slice(0, -1) : l.pathname;
          window.history.replaceState(null, null,
            basePath + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <!-- T10: Content Security Policy — restricts script/style/connect sources -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; font-src 'self'; connect-src 'self' https://celestrak.org https://api.wheretheiss.at https://cache.wheretheiss.at https://www.space-track.org; worker-src blob:;" />
