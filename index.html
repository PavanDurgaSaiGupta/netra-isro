<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="NETRA — Bharat's Eyes in Orbit. A concept mission-control site visualizing India's space debris tracking capabilities." />
    <meta name="theme-color" content="#05070A" />
    <!-- Canonical + Open Graph + Twitter card — the GitHub Pages base is the canonical
         origin; og:image ships the static hero frame (og:image must be an absolute URL). -->
    <link rel="canonical" href="https://pavandurgasaigupta.github.io/netra-isro/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NETRA" />
    <meta property="og:title" content="NETRA — Bharat's Eyes in Orbit" />
    <meta property="og:description" content="A concept mission-control site visualizing India's space debris tracking capabilities." />
    <meta property="og:url" content="https://pavandurgasaigupta.github.io/netra-isro/" />
    <meta property="og:image" content="https://pavandurgasaigupta.github.io/netra-isro/earth_orbit_cinematic.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NETRA — Bharat's Eyes in Orbit" />
    <meta name="twitter:description" content="A concept mission-control site visualizing India's space debris tracking capabilities." />
    <meta name="twitter:image" content="https://pavandurgasaigupta.github.io/netra-isro/earth_orbit_cinematic.jpg" />
    <!-- Structured data — WebApplication entry for crawlers / AI answer engines. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "NETRA — Bharat's Eyes in Orbit",
        "applicationCategory": "ScienceApplication",
        "operatingSystem": "Web",
        "url": "https://pavandurgasaigupta.github.io/netra-isro/",
        "description": "A concept mission-control site visualizing India's space debris tracking capabilities.",
        "image": "https://pavandurgasaigupta.github.io/netra-isro/earth_orbit_cinematic.jpg",
        "inLanguage": "en"
      }
    </script>
    <!-- Single Page App Redirect Restoration for GitHub Pages / static hosting -->
    <script>
      (function(l) {
        if (l.search && l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          var basePath = l.pathname.endsWith('/') ? l.pathname.slice(0, -1) : l.pathname;
          window.history.replaceState(null, null,
            basePath + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <!-- T10: Content Security Policy — restricts script/style/connect sources -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; font-src 'self'; connect-src 'self' https://celestrak.org https://api.wheretheiss.at https://cache.wheretheiss.at https://www.space-track.org https://db.satnogs.org; worker-src blob:;" />
    <title>NETRA — Bharat's Eyes in Orbit</title>
    <!-- T01: Self-hosted fonts — eliminates render-blocking Google Fonts CDN round-trip.
         Fonts downloaded to public/fonts/ via download-fonts.mjs; font-display: swap
         guaranteed in fonts.css so text renders immediately with system font fallback. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <!-- T14: Preload the above-the-fold hero image so the browser discovers it
         before parsing the React bundle and rendering the img tag. -->
    <link rel="preload" as="image" href="/earth_orbit_cinematic.webp" type="image/webp" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/yMJRMIlzdpvBhQQL_Qq7dy0.woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
